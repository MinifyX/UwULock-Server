    </g>
    <path d="M194 160 V110 A62 62 0 0 1 318 110 V160 H288 V110 A32 32 0 0 0 224 110 V160 Z" fill="#C9B6F0" stroke="#4B1D3F" stroke-width="17"/>
    <g fill="#FF6FA6" stroke="#4B1D3F" stroke-width="17">
      <path d="M118 196 L132 100 Q135 82 151 91 L230 150 Z"/>
      <path d="M394 196 L380 100 Q377 82 361 91 L282 150 Z"/>
