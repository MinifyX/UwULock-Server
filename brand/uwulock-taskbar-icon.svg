<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="UwULock: a padlock with cat ears">
  <title>UwULock</title>
  <!--
    Taskbar, window and Linux menus: Nyu alone, upright, no tile. A padlock,
    shackle between the ears and a golden keyhole on the dark plate, so it
    reads as a password vault; the ears and blush say Nyu. The white die-cut
    edge keeps it visible on dark and light taskbars.
  -->
