[package]
name = "uwulock-server"
description = "UwULock Server: a Bitwarden-compatible password server for UwULock and the official Bitwarden apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# No examples in the docs to run: rustdoc would only take time on every `cargo test`.
[lib]
doctest = false

# Its tests are the library's and those in tests/: a test harness of main.rs would only be
# linked for nothing.
[[bin]]
name = "uwulock-server"
path = "src/main.rs"
test = false

[dependencies]
uwulock-api.workspace = true
uwulock-mail.workspace = true
uwulock-store.workspace = true

axum.workspace = true
base64.workspace = true
ciborium.workspace = true
axum-server.workspace = true
clap.workspace = true
hyper-util.workspace = true
libc.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
ring.workspace = true
rusqlite.workspace = true
rustls.workspace = true
rustls-acme.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tempfile.workspace = true
time.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tower.workspace = true
uwulock-api.workspace = true
rcgen.workspace = true
