[package]
name = "uwulock-api"
description = "UwULock Server's HTTP side: the Bitwarden-compatible API, UwULock's own under /uwu, the web vault"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# No examples in the docs to run: rustdoc would only take time on every `cargo test`.
[lib]
doctest = false

[dependencies]
uwulock-mail.workspace = true
uwulock-notify.workspace = true
uwulock-store.workspace = true
uwulock-web.workspace = true

argon2.workspace = true
axum.workspace = true
base64.workspace = true
ciborium.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
# A real WebSocket client for the hub's test; the same version axum speaks with.
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
