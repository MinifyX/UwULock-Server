[package]
name = "uwulock-e2e"
description = "UwULock's own client against the real server: the tests that say UwULock and UwULock Server work together"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# The library is empty; the tests are in tests/.
[lib]
test = false
doctest = false

[dependencies]

[dev-dependencies]
uwulock-api.workspace = true
uwulock-server.workspace = true
uwulock-store.workspace = true
# UwULock's client, at a fixed commit: what the desktop app uses to log in, sync and save.
uwulock-bitwarden = { git = "https://github.com/MinifyX/UwULock-Client", rev = "0dac221886c8ffb971efb2c730e044f6fa43fea4" }
# Its crypto for what only UwULock does: the extras key, file requests.
uwulock-core = { git = "https://github.com/MinifyX/UwULock-Client", rev = "0dac221886c8ffb971efb2c730e044f6fa43fea4" }
base64.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
zeroize = "1"
# The realtime channel, as a suite app opens it; the versions uwulock-api's tests use.
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
