[package]
name = "uwulock-web-core"
description = "The web vault's crypto and vault: uwulock-core, as WebAssembly, behind the calls the page makes"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/MinifyX/UwULock-Server"
rust-version = "1.89"
publish = false

# A workspace of its own: the server's `cargo test --workspace` never builds this, and this never
# builds the server.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# UwULock's crypto and vault, the same the desktop app uses, at the commit uwulock-e2e tests.
uwulock-core = { git = "https://github.com/MinifyX/UwULock-Client", rev = "9333136b151dcddf588ef948ff1c9aa5d8295c1c" }
base64 = "0.22"
# KeePass files: their key derivations (Argon2d/Argon2id, AES-KDF), the same crates uwulock-core
# takes its Argon2id and AES from.
aes = "0.8"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
sha2 = "0.10"
# Randomness in the browser, for access codes: the same getrandom uwulock-core takes it from.
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The password check asks Have I Been Pwned by the first characters of a SHA-1.
sha1 = "0.10"
# …and XposedOrNot by the first characters of a Keccak-512 (the original Keccak, as its API wants).
sha3 = "0.10"
url = "2"
wasm-bindgen = "=0.2.129"
zeroize = "1"

[profile.release]
# Speed over size: the page derives the master key in here, and PBKDF2 or Argon2 is most of
# what a login waits for.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The tests make RSA keys, which unoptimised takes seconds each.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
