<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="UwULock app icon: Nyu as a padlock with cat ears">
  <title>UwULock</title>
  <!--
    The website and GitHub icon, built like UwUMail's: Nyu slightly tilted on
    UwUMail's pastel pink tile (#FFF3F8 to #FFD3E5, the same for every UwU
    app), with sparkles and a heart arranged differently for each app.
    The shackle between the ears and the golden keyhole say password vault.
    Here: the big star top left, a small star right, the heart bottom left.
  -->
  <defs>
    <linearGradient id="uwu-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3F8"/>
      <stop offset="1" stop-color="#FFD3E5"/>
    </linearGradient>
    <filter id="uwu-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#C2306F" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#uwu-bg)"/>
  <g transform="translate(256 292) rotate(-8) scale(0.9) translate(-256 -243)">
    <g filter="url(#uwu-shadow)"><g stroke-linecap="round" stroke-linejoin="round">
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="44">
