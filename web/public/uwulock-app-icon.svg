      <path d="M364 140 L360 118 Q359 110 352 114 L320 138 Z"/>
    </g>
    <rect x="100" y="140" width="312" height="220" rx="46" fill="#FF6FA6" stroke="#4B1D3F" stroke-width="14"/>
    <rect x="124" y="164" width="264" height="172" rx="28" fill="#2A2458" stroke="#4B1D3F" stroke-width="11"/>
